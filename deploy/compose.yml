name: glucocare

services:
  glucocare-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - glucocare_pgdata:/var/lib/postgresql/data
    networks:
      - glucocare-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  glucocare-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: glucocare-api:latest
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_HOST: glucocare-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_DAYS: ${GLUCOCARE_SESSION_DAYS:-30}
      PUBLIC_API_URL: ${GLUCOCARE_PUBLIC_API_URL:-http://127.0.0.1:18084}
      CORS_ORIGIN: ${GLUCOCARE_CORS_ORIGIN:-http://127.0.0.1:18082}
      PROVIDER_CALLBACK_SECRET: ${GLUCOCARE_PROVIDER_CALLBACK_SECRET:-}
      PROVIDER_REQUEST_TIMEOUT_MS: ${GLUCOCARE_PROVIDER_REQUEST_TIMEOUT_MS:-10000}
      RESEND_API_KEY: ${GLUCOCARE_RESEND_API_KEY:-}
      RESEND_FROM: ${GLUCOCARE_RESEND_FROM:-}
      TWILIO_ACCOUNT_SID: ${GLUCOCARE_TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${GLUCOCARE_TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${GLUCOCARE_TWILIO_FROM:-}
    depends_on:
      glucocare-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18084:8080"
    networks:
      - glucocare-backend
      - glucocare-edge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m

  glucocare-alert-worker:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: glucocare-api:latest
    restart: unless-stopped
    command: ["node", "dist/alertWorker.js"]
    environment:
      DATABASE_HOST: glucocare-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      # The worker shares the same production-origin guard as the API. Without
      # this value provider delivery would remain fail-closed even when valid
      # Resend/Twilio credentials were installed on the VPS.
      PUBLIC_API_URL: ${GLUCOCARE_PUBLIC_API_URL:-http://127.0.0.1:18084}
      ALERT_WORKER_INTERVAL_MS: ${GLUCOCARE_ALERT_WORKER_INTERVAL_MS:-5000}
      ALERT_WORKER_BATCH_SIZE: ${GLUCOCARE_ALERT_WORKER_BATCH_SIZE:-10}
      ALERT_WORKER_MAX_ATTEMPTS: ${GLUCOCARE_ALERT_WORKER_MAX_ATTEMPTS:-5}
      ALERT_WORKER_MAINTENANCE_INTERVAL_MS: ${GLUCOCARE_ALERT_WORKER_MAINTENANCE_INTERVAL_MS:-3600000}
      PROVIDER_REQUEST_TIMEOUT_MS: ${GLUCOCARE_PROVIDER_REQUEST_TIMEOUT_MS:-10000}
      RESEND_API_KEY: ${GLUCOCARE_RESEND_API_KEY:-}
      RESEND_FROM: ${GLUCOCARE_RESEND_FROM:-}
      TWILIO_ACCOUNT_SID: ${GLUCOCARE_TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${GLUCOCARE_TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${GLUCOCARE_TWILIO_FROM:-}
    depends_on:
      glucocare-db:
        condition: service_healthy
    networks:
      - glucocare-backend
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const s=fs.statSync('/tmp/glucocare-alert-worker.heartbeat');if(Date.now()-s.mtimeMs>120000)process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  glucocare-docs:
    build:
      context: ..
      dockerfile: Dockerfile
    image: glucocare-docs:latest
    container_name: glucocare-docs
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=1777
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=1777
      - /tmp:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=1777

  glucocare-web:
    build:
      context: ..
      dockerfile: deploy/mobile.Dockerfile
    image: glucocare-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:8080"
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=1777
      - /var/run:rw,noexec,nosuid,size=1m,uid=101,gid=101,mode=1777
      - /tmp:rw,noexec,nosuid,size=4m,uid=101,gid=101,mode=1777

networks:
  glucocare-backend:
    internal: true
  glucocare-edge:

volumes:
  glucocare_pgdata:
