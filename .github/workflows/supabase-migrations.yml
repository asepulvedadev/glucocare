name: Supabase migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed migration plan after the dry run
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  migrate:
    name: Validate and optionally apply hosted migrations
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.89.1

      - name: Require hosted project credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Link hosted project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration dry run
        run: supabase db push --linked --dry-run

      - name: Apply migrations
        if: ${{ inputs.apply == true }}
        run: supabase db push --linked
