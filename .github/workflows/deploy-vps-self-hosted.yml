name: Deploy VPS staging (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glucocare-vps-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Expo web staging
    # This runner is intentionally restricted to the deployment path: the
    # workflow never runs for pull requests from the public repo.
    runs-on: [self-hosted, linux, x64, glucocare-vps]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify deployment tools
        run: |
          set -euo pipefail
          command -v node
          command -v npm
          command -v docker
          test -x /usr/local/sbin/glucocare-deploy

      - name: Install mobile dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate mobile app before deployment
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run

      - name: Export Expo web bundle
        run: npx expo export --platform web

      - name: Stream release to the local VPS deploy wrapper
        working-directory: .
        run: |
          set -euo pipefail
          tar --exclude-vcs \
                --exclude='./.github' \
                --exclude='./apps/mobile/node_modules' \
                --exclude='./apps/mobile/.expo' \
                --create --gzip --file=- . \
            | /usr/local/sbin/glucocare-deploy

      - name: Verify staging health
        working-directory: .
        run: |
          set -euo pipefail
          for container in glucocare-glucocare-web-1 glucocare-docs; do
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          done
          curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null
          curl --fail --silent http://127.0.0.1:18082/healthz >/dev/null
