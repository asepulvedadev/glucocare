name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: glucocare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation and image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Markdown links and required files
        run: python3 scripts/validate-docs.py

      - name: Scan tracked files for high-confidence secrets
        run: python3 scripts/scan-secrets.py

      - name: Validate deployment scripts and Compose configuration
        run: bash scripts/validate-deployment.sh

      - name: Build deployment image
        run: docker build --pull --tag glucocare-docs:test .

      - name: Smoke-test deployment image
        run: |
          docker run --detach --rm --name glucocare-docs-test --publish 127.0.0.1:18081:8080 glucocare-docs:test
          trap 'docker stop glucocare-docs-test' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then exit 0; fi
            sleep 1
          done
          exit 1

  mobile:
    name: Validate Expo mobile app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate dependency SBOM
        run: npm sbom --sbom-format=cyclonedx --omit=dev > glucocare-sbom.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@v6
        with:
          name: glucocare-mobile-sbom-${{ github.sha }}
          path: apps/mobile/glucocare-sbom.json
          if-no-files-found: error

      - name: Expo doctor
        run: npx expo-doctor

      - name: Validate native prebuild configuration
        run: CI=1 npx expo prebuild --no-install

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Domain tests
        env:
          TZ: America/Bogota
        run: npm test

      - name: Smoke-test mobile SQLite migration
        working-directory: .
        run: python3 scripts/smoke-mobile-outbox-migration.py

      - name: Export web bundle
        run: npx expo export --platform web

      - name: Enforce lightweight web bundle budget
        run: |
          bytes=$(du -sb dist | cut -f1)
          test "$bytes" -le 5242880
          echo "Web bundle size: ${bytes} bytes (budget: 5242880)"

  database:
    name: Validate PostgreSQL API and migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: glucocare
          POSTGRES_USER: glucocare_app
          POSTGRES_PASSWORD: glucocare_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glucocare_app -d glucocare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install API dependencies
        working-directory: server
        run: npm ci

      - name: Build API
        working-directory: server
        run: npm run build

      - name: Verify provider HTTPS guard
        working-directory: server
        run: |
          PUBLIC_API_URL=http://127.0.0.1:18084 \
          RESEND_API_KEY=synthetic-resend-key \
          RESEND_FROM=alerts@example.invalid \
          EXPECTED_PROVIDER_CONFIGURED=false \
          node scripts/smoke-provider-config.mjs
          PUBLIC_API_URL=https://synthetic.example.invalid \
          RESEND_API_KEY=synthetic-resend-key \
          RESEND_FROM=alerts@example.invalid \
          EXPECTED_PROVIDER_CONFIGURED=true \
          node scripts/smoke-provider-config.mjs

      - name: Smoke-test API and PostgreSQL persistence
        working-directory: server
        env:
          DATABASE_URL: postgresql://glucocare_app:glucocare_ci_password@127.0.0.1:5432/glucocare
          PORT: 18084
        run: |
          set -euo pipefail
          node scripts/synthetic-provider.mjs >/tmp/glucocare-provider.log 2>&1 &
          provider_pid=$!
          trap 'kill "$provider_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18085/healthz >/dev/null; then break; fi
            sleep 1
          done
          PUBLIC_API_URL=https://synthetic.example.invalid \
          RESEND_API_KEY=synthetic-resend-key \
          RESEND_FROM=alerts@example.invalid \
          RESEND_API_URL=http://127.0.0.1:18085/emails \
          PROVIDER_CALLBACK_SECRET=synthetic-callback-secret \
          node dist/server.js >/tmp/glucocare-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" "$provider_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18084/healthz | grep -q '"database":"ok"'; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18084/healthz | grep -q '"database":"ok"'
          EXPECTED_SMS_INVITATION_STATUS=not_configured \
          EXPECTED_EMAIL_INVITATION_STATUS=provider_accepted \
          PROVIDER_CALLBACK_SECRET=synthetic-callback-secret \
          AUDIT_DB_URL=postgresql://glucocare_app:glucocare_ci_password@127.0.0.1:5432/glucocare \
          node scripts/smoke-api.mjs
          PROVIDER_CALLBACK_SECRET=synthetic-callback-secret node scripts/smoke-provider-callback.mjs
          ALERT_WORKER_ONCE=true node dist/alertWorker.js >/tmp/glucocare-alert-worker.log 2>&1
          npm run test:worker
          PUBLIC_API_URL=https://synthetic.example.invalid node scripts/smoke-provider-retry.mjs
          grep -q 'glucocare-alert-worker' /tmp/glucocare-alert-worker.log
