name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: glucocare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation and image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Markdown links and required files
        run: python3 scripts/validate-docs.py

      - name: Build deployment image
        run: docker build --pull --tag glucocare-docs:test .

      - name: Smoke-test deployment image
        run: |
          docker run --detach --rm --name glucocare-docs-test --publish 127.0.0.1:18081:8080 glucocare-docs:test
          trap 'docker stop glucocare-docs-test' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then exit 0; fi
            sleep 1
          done
          exit 1

  deploy:
    name: Deploy documentation staging to AutoKing VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Stream release to VPS
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude-vcs --exclude='./.github' --create --gzip --file=- . \
            | ssh -i "$HOME/.ssh/id_ed25519" \
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
