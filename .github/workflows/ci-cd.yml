name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: glucocare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation and image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Markdown links and required files
        run: python3 scripts/validate-docs.py

      - name: Scan tracked files for high-confidence secrets
        run: python3 scripts/scan-secrets.py

      - name: Build deployment image
        run: docker build --pull --tag glucocare-docs:test .

      - name: Smoke-test deployment image
        run: |
          docker run --detach --rm --name glucocare-docs-test --publish 127.0.0.1:18081:8080 glucocare-docs:test
          trap 'docker stop glucocare-docs-test' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then exit 0; fi
            sleep 1
          done
          exit 1

  mobile:
    name: Validate Expo mobile app
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo doctor
        run: npx expo-doctor

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Domain tests
        run: npm test

      - name: Export web bundle
        run: npx expo export --platform web

  database:
    name: Validate Supabase schema and RLS foundation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the CLI so CI does not depend on GitHub's latest-release API
          # (which is rate-limited and has caused otherwise-valid runs to fail).
          version: 2.89.1

      - name: Start local database
        run: supabase db start

      - name: Lint migrations
        run: supabase db lint --local --level warning --fail-on error

      - name: Verify migration history
        run: supabase migration list --local

      - name: Smoke-test cursor timestamp triggers
        run: PGPASSWORD=postgres psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f scripts/smoke-sync-timestamps.sql

      - name: Smoke-test owner-only RLS writes
        run: PGPASSWORD=postgres psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f scripts/smoke-rls-owner-writes.sql

      - name: Smoke-test contact invitation RLS
        run: PGPASSWORD=postgres psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f scripts/smoke-contact-invitation.sql

      - name: Smoke-test private alert delivery worker
        run: |
          set -euo pipefail
          supabase functions serve --no-verify-jwt >/tmp/glucocare-functions.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if grep -q 'Serving functions on' /tmp/glucocare-functions.log; then
              grep -q 'process-alert-deliveries' /tmp/glucocare-functions.log
              grep -q 'contact-invitation' /tmp/glucocare-functions.log
              exit 0
            fi
            sleep 1
          done
          cat /tmp/glucocare-functions.log
          exit 1

  deploy:
    name: Deploy docs and Expo web staging to AutoKing VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, mobile, database]
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22 for web bundle
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Build Expo web bundle for VPS staging
        working-directory: apps/mobile
        run: |
          npm ci --legacy-peer-deps
          npx expo export --platform web

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Stream release to VPS
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude-vcs \
                --exclude='./.github' \
                --exclude='./apps/mobile/node_modules' \
                --exclude='./apps/mobile/.expo' \
                --create --gzip --file=- . \
            | ssh -i "$HOME/.ssh/id_ed25519" \
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST"
