name: Native mobile build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      platform:
        description: Native platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios

permissions:
  contents: read

jobs:
  build:
    name: EAS ${{ inputs.platform }} / ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Require EAS authentication
        run: test -n "$EXPO_TOKEN"

      - name: Require HTTPS API for production builds
        if: inputs.profile == 'production'
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_API_URL"
          case "$EXPO_PUBLIC_API_URL" in
            https://*) ;;
            *) echo 'Production native builds require an HTTPS EXPO_PUBLIC_API_URL.' >&2; exit 1 ;;
          esac

      - name: Link or verify EAS project
        shell: bash
        run: |
          set -euo pipefail
          if ! npx eas-cli@latest project:info --json >/tmp/glucocare-eas-project.json 2>/dev/null; then
            npx eas-cli@latest init --non-interactive
          fi

      - name: Build native artifact
        run: npx eas-cli@latest build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
