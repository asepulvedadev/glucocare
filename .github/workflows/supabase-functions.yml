name: Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: Edge Function to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - contact-invitation
          - delete-account
          - emergency-alert
          - process-alert-deliveries
          - record-glucose-audit

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.function }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.89.1

      - name: Require hosted project credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Deploy selected functions
        shell: bash
        run: |
          set -euo pipefail
          functions=("${{ inputs.function }}")
          if [[ "${{ inputs.function }}" == "all" ]]; then
            functions=(contact-invitation delete-account emergency-alert process-alert-deliveries record-glucose-audit)
          fi
          for function in "${functions[@]}"; do
            if [[ "$function" == "process-alert-deliveries" ]]; then
              supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt --yes
            else
              supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
            fi
          done
