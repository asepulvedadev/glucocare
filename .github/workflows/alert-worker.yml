name: Process emergency alert queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glucocare-alert-worker
  cancel-in-progress: false

jobs:
  process:
    name: Drain private alert queue
    runs-on: ubuntu-24.04
    environment: production
    env:
      ALERT_WORKER_URL: ${{ secrets.ALERT_WORKER_URL }}
      ALERT_WORKER_SECRET: ${{ secrets.ALERT_WORKER_SECRET }}
    steps:
      - name: Require worker configuration
        run: |
          set -euo pipefail
          test -n "$ALERT_WORKER_URL"
          test -n "$ALERT_WORKER_SECRET"

      - name: Process queued deliveries
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            --request POST "$ALERT_WORKER_URL" \
            --header "x-alert-worker-secret: $ALERT_WORKER_SECRET" \
            --header "content-type: application/json" \
            --data '{}'
